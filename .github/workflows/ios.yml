name: iOS build (simulator)

# 맥이 없어도 iOS 코드를 시험한다: 클라우드 맥에서 XcodeGen → 빌드 → 단위 시험 → 시뮬레이터 실행 화면 캡처.
# 결과(로그 · 스크린샷)는 Actions 의 Artifacts 에서 받는다. 서명 없이 시뮬레이터용으로만 빌드한다(실기기 · TestFlight 는 Apple 개발자 계정이 필요하다).
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: 글꼴 만들기 (안드로이드와 같은 Noto Sans KR)
        run: |
          pip3 install --quiet --break-system-packages fonttools || pip3 install --quiet fonttools
          python3 scripts/make_fonts.py
      - name: XcodeGen 설치 · 프로젝트 생성
        run: |
          brew install xcodegen
          xcodegen
      - name: 시뮬레이터 고르기
        run: |
          xcodebuild -version
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys,re
          d=json.load(sys.stdin)['devices']
          c=[x for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')]
          # 다이내믹 아일랜드가 있는 기종(14 Pro 이상 · 15 · 16 · 17, 'e' 제외)을 먼저 고른다
          di=[x for x in c if re.match(r'iPhone (1[4-9]|2\d)( Pro)?( Max)?$', x['name']) and x['name'] not in ('iPhone 14','iPhone 14 Plus')]
          pro=[x for x in di if 'Pro' in x['name'] and 'Max' not in x['name']]
          pick=(pro or di or c)
          print(pick[-1]['udid'] if pick else '')")
          xcrun simctl list devices available | grep "$UDID" || true
          echo "UDID=$UDID" >> $GITHUB_ENV
          echo "시뮬레이터: $UDID"
      - name: 빌드 + 단위 시험
        run: |
          set -o pipefail
          xcodebuild test -project Gildongmu.xcodeproj -scheme Gildongmu \
            -destination "id=$UDID" -derivedDataPath build \
            -resultBundlePath build/result.xcresult CODE_SIGNING_ALLOWED=NO 2>&1 | tee build.log | tail -60
      - name: 실행 화면 캡처
        if: always()
        run: |
          APP=$(find build/Build/Products -name 'Gildongmu.app' -maxdepth 3 | head -1)
          echo "앱: $APP"
          xcrun simctl boot "$UDID" || true
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl privacy "$UDID" grant location com.dullyyj.subway.ios || true
          xcrun simctl location "$UDID" set 37.5547,126.9707 || true
          xcrun simctl launch "$UDID" com.dullyyj.subway.ios
          sleep 15
          xcrun simctl io "$UDID" screenshot screenshot-1.png
          xcrun simctl ui "$UDID" appearance dark
          sleep 4
          xcrun simctl io "$UDID" screenshot screenshot-2-dark.png
          # 탭 화면: 커뮤니티 · 쇼핑 (서버에서 받아 그린 모습)
          xcrun simctl privacy "$UDID" grant location com.dullyyj.subway.ios || true
          xcrun simctl location "$UDID" set 37.5547,126.9707 || true
          for T in home map community shop food; do
            xcrun simctl terminate "$UDID" com.dullyyj.subway.ios || true
            xcrun simctl privacy "$UDID" grant location com.dullyyj.subway.ios || true
            xcrun simctl launch "$UDID" com.dullyyj.subway.ios -tab $T
            sleep 22
            xcrun simctl io "$UDID" screenshot screenshot-tab-$T.png
          done
          xcrun simctl terminate "$UDID" com.dullyyj.subway.ios || true
          xcrun simctl launch "$UDID" com.dullyyj.subway.ios -tab map -map_mode subway
          sleep 22
          xcrun simctl io "$UDID" screenshot screenshot-tab-map-subway.png
          for CM in set board chat; do
            xcrun simctl terminate "$UDID" com.dullyyj.subway.ios || true
            xcrun simctl launch "$UDID" com.dullyyj.subway.ios -tab community -ccMode $CM
            sleep 22
            xcrun simctl io "$UDID" screenshot screenshot-tab-community-$CM.png
          done
          xcrun simctl terminate "$UDID" com.dullyyj.subway.ios || true
          xcrun simctl launch "$UDID" com.dullyyj.subway.ios -tab community -ccMode news -newsDetail 1
          sleep 26
          xcrun simctl io "$UDID" screenshot screenshot-tab-community-newsdetail.png
          xcrun simctl terminate "$UDID" com.dullyyj.subway.ios || true
          xcrun simctl launch "$UDID" com.dullyyj.subway.ios -tab food -foodOpen 1
          sleep 40
          xcrun simctl io "$UDID" screenshot screenshot-tab-food-open.png
          xcrun simctl terminate "$UDID" com.dullyyj.subway.ios || true
          xcrun simctl launch "$UDID" com.dullyyj.subway.ios -tab home -homeDest 명동
          sleep 22
          xcrun simctl io "$UDID" screenshot screenshot-tab-home-search.png
          xcrun simctl terminate "$UDID" com.dullyyj.subway.ios || true
          xcrun simctl launch "$UDID" com.dullyyj.subway.ios -tab home -homeRoute 1
          sleep 30
          xcrun simctl io "$UDID" screenshot screenshot-tab-home-route.png
          xcrun simctl terminate "$UDID" com.dullyyj.subway.ios || true
          xcrun simctl launch "$UDID" com.dullyyj.subway.ios -tab home -homeRoute 1 -homeDetail 1
          sleep 34
          xcrun simctl io "$UDID" screenshot screenshot-tab-home-detail.png
          xcrun simctl terminate "$UDID" com.dullyyj.subway.ios || true
          # 다이내믹 아일랜드: 견본 overlay 로 실시간 현황을 띄우고 다른 앱(사파리)으로 넘어가 섬 모양을 찍는다
          for K in moving wait alert2 alert1 arrived; do
            xcrun simctl terminate "$UDID" com.dullyyj.subway.ios || true
            xcrun simctl uninstall "$UDID" com.dullyyj.subway.ios || true
            xcrun simctl install "$UDID" "$APP"
            xcrun simctl launch "$UDID" com.dullyyj.subway.ios -demoRide $K
            sleep 6
            xcrun simctl launch "$UDID" com.apple.mobilesafari || true
            sleep 4
            xcrun simctl io "$UDID" screenshot screenshot-island-$K.png
          done
          # 여정: 이동 중 → 5초 뒤 도착 갱신. 도착 순간 섬이 저절로 펼쳐지는지(알림 펼침) 앞뒤로 찍는다
          xcrun simctl terminate "$UDID" com.dullyyj.subway.ios || true
          xcrun simctl uninstall "$UDID" com.dullyyj.subway.ios || true
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch "$UDID" com.dullyyj.subway.ios -demoRide journey
          sleep 4
          xcrun simctl io "$UDID" screenshot screenshot-journey-1-before.png
          for N in 2 3 4 5; do
            sleep 1.2
            xcrun simctl io "$UDID" screenshot screenshot-journey-$N-arrive.png
          done
          xcrun simctl launch "$UDID" com.apple.mobilesafari || true
          sleep 3
          xcrun simctl io "$UDID" screenshot screenshot-journey-6-after.png
      - name: 영상 녹화 (다이내믹 아일랜드 있는 폰 · 없는 폰) — 직접 실행(workflow_dispatch)할 때만
        if: always() && github.event_name == 'workflow_dispatch'
        run: |
          APP=$(find build/Build/Products -name 'Gildongmu.app' -maxdepth 3 | head -1)
          NOISL=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys,re
          d=json.load(sys.stdin)['devices']
          c=[x for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')]
          for pat in (r'iPhone 16e$', r'iPhone SE', r'iPhone 14$', r'iPhone 13'):
              m=[x for x in c if re.match(pat, x['name'])]
              if m: print(m[-1]['udid']); break")
          echo "섬 없는 폰: $NOISL"
          ax() {  # 접근성 입력은 가끔 실패(-25204)해서 몇 번 다시 한다
            for t in 1 2 3 4 5; do osascript -e 'tell application "Simulator" to activate' -e 'delay 0.5' -e "$1" && return 0; sleep 1; done; return 0
          }
          rec() {  # $1 udid  $2 이름
            U=$1; N=$2
            xcrun simctl boot "$U" 2>/dev/null || true
            xcrun simctl bootstatus "$U" -b >/dev/null 2>&1 || true
            xcrun simctl terminate "$U" com.dullyyj.subway.ios 2>/dev/null || true
            xcrun simctl uninstall "$U" com.dullyyj.subway.ios 2>/dev/null || true
            xcrun simctl install "$U" "$APP"
            xcrun simctl ui "$U" appearance dark
            xcrun simctl privacy "$U" grant location com.dullyyj.subway.ios || true
            xcrun simctl privacy "$U" grant location-always com.dullyyj.subway.ios || true
            xcrun simctl location "$U" set 37.5547,126.9707 || true
            xcrun simctl io "$U" recordVideo --codec=h264 --force "video-$N.mp4" &
            RP=$!
            sleep 3
            xcrun simctl launch "$U" com.dullyyj.subway.ios -demoRide journey
            if [ "$N" = noisland ]; then
              # 섬이 없는 폰: 실시간 현황은 잠금화면에만 보인다 → 잠그고(⌘L) 깨워서 '허용'을 누른 뒤 도착을 찍는다
              sleep 3
              ax 'tell application "System Events" to keystroke "l" using {command down}'
              sleep 3
              ax 'tell application "System Events" to key code 49'   # 화면 깨우기
              sleep 2
              G=$(osascript -e 'tell application "System Events" to tell process "Simulator" to get {position, size} of window 1' 2>&1 || true)
              echo "시뮬레이터 창: $G"
              python3 scripts/click_pos.py "$G" > /tmp/clk.txt || true
              if [ -s /tmp/clk.txt ]; then read CX CY < /tmp/clk.txt; ax "tell application \"System Events\" to click at {$CX, $CY}"; fi
              sleep 8
              xcrun simctl io "$U" screenshot "screenshot-noisland-lock.png" || true
              sleep 4
            else
              sleep 2
              xcrun simctl launch "$U" com.apple.mobilesafari || true
              sleep 16
            fi
            kill -INT $RP; wait $RP || true
          }
          rec "$UDID" island
          if [ -n "$NOISL" ]; then rec "$NOISL" noisland; fi
          ls -la video-*.mp4 || true
      - name: 엔진 응답 확인용(개발) — 같은 요청을 직접 보내 받은 글을 ios-ci-out 에 남긴다
        continue-on-error: true
        run: |
          B=https://route-v2.phg0643.workers.dev
          H='content-type: application/json'
          curl -sS -m 25 -H "$H" -d '{"cap":29,"f":{"part":"b","mode":"bus","reg":"seoul","flt":"ALL","th":"dark","gps":[37.5547,126.9707],"bus":{"vw":"near","sel":-1,"sv":1,"svb":300,"fav":[],"nx":{},"al":{},"ord":[],"lat":37.5547,"lng":126.9707,"res":{}}}}' $B/screen/map > probe-map-bus-body.json || true
          curl -sS -m 25 -H "$H" -d '{"cap":29,"f":{"part":"h","mode":"bus","reg":"seoul","flt":"ALL","th":"dark","gps":[37.5547,126.9707]}}' $B/screen/map > probe-map-bus-head.json || true
          curl -sS -m 25 -H "$H" -d '{"cap":29,"f":{"part":"b","mode":"subway","reg":"seoul","flt":"ALL","th":"dark","gps":[37.5547,126.9707]}}' $B/screen/map > probe-map-subway-body.json || true
          curl -sS -m 20 "https://board-writer.phg0643.workers.dev/talks?limit=30" > probe-talks-raw.json || true
          python3 - <<'PY' || true
          import json
          raw=json.load(open("probe-talks-raw.json"))
          g=[[t.get("nick",""),t.get("text",""),t.get("ts",0),0,t.get("line",""),str(t.get("id",""))] for t in raw.get("talks",[])]
          body={"cap":29,"f":{"sel":"all","sec":[],"my":[],"th":"dark","st":"ready","tzo":-540,"me":"","hid":[]},"d":{"g":g,"r":[],"off":None,"offOk":0,"offAt":0,"al":None}}
          json.dump(body,open("probe-chat-req.json","w"))
          PY
          curl -sS -m 25 -H "$H" -d @probe-chat-req.json $B/screen/chat > probe-chat-all.json || true
          D=$(xcrun simctl get_app_container "$UDID" com.dullyyj.subway.ios data 2>/dev/null || true)
          [ -n "$D" ] && cp "$D/Documents/unknown-kinds.txt" probe-unknown-kinds.json 2>/dev/null || true
          [ -n "$D" ] && cp "$D/Documents/home-screen.json" probe-home-screen.json 2>/dev/null || true
          [ -n "$D" ] && cp "$D/Documents/home-hcards.json" probe-home-hcards.json 2>/dev/null || true
          echo "container=$D"; ls "$D/Documents" 2>/dev/null || true
          ls -la probe-*.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-result
          path: |
            build.log
            screenshot-*.png
            video-*.mp4
            build/result.xcresult
      - name: 결과를 ios-ci-out 브랜치에 올리기 (Artifacts 를 못 받는 환경에서 화면을 확인하려고)
        if: always()
        run: |
          mkdir -p /tmp/out && cp screenshot-*.png video-*.mp4 probe-*.json /tmp/out/ 2>/dev/null || true
          tail -300 build.log > /tmp/out/build-tail.log || true
          cd /tmp/out && git init -q && git checkout -q -b ios-ci-out
          git config user.name ci && git config user.email ci@users.noreply.github.com
          git add -A && git commit -qm "ios CI 결과 ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ios-ci-out
